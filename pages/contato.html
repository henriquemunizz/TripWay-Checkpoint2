<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay - Contato</title>

    <link rel="stylesheet" href="../css/contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <a href="../index.html" class="navbar-logo">
            <img src="../images/tripway.png" alt="Logo TripWay">
        </a>

        <ul class="navbar-list">
            <li class="navbar-item">
                <a href="../index.html" class="navbar-link">Home</a>
            </li>

            <li class="navbar-item">
                <a href="destinos.html" class="navbar-link">Destinos</a>
            </li>

            <li class="navbar-item">
                <a href="pacotes.html" class="navbar-link">Pacotes</a>
            </li>

            <li class="navbar-item">
                <a href="contato.html" class="navbar-link active-link">Contato</a>
            </li>
        </ul>
    </nav>

    <header class="contact-header">
        <h1 class="contact-title">Contato e Reserva</h1>

        <img src="../images/reserva.png" alt="Reserva de viagem" class="contact-image">

        <p class="contact-description">
            Entre em contato e garanta sua próxima viagem com praticidade,
            segurança e atendimento personalizado. ✈️🌍
        </p>
    </header>

    <main class="contact-main">

        <section class="contact-form-section">
            <h2 class="contact-form-title">Formulário de Contato</h2>

            <form class="contact-form">

                <div class="contact-form-group">
                    <label for="name" class="contact-label">Nome Completo</label>
                    <input type="text" id="name" class="contact-input" placeholder="Ex: Maria de Lourdes" required>
                </div>

                <div class="contact-form-group">
                    <label for="email" class="contact-label">E-mail</label>
                    <input type="email" id="email" class="contact-input" placeholder="Ex: email@gmail.com" required>
                </div>

                <div class="contact-form-group">
                    <label for="destination" class="contact-label">Destino de interesse</label>

                    <select id="destination" class="contact-select">
                        <option value="barcelona">Barcelona</option>
                        <option value="franca">França</option>
                        <option value="okinawa">Okinawa</option>
                    </select>
                </div>

                <div class="contact-form-group">
                    <label for="date" class="contact-label">Data</label>
                    <input type="date" id="date" class="contact-input" required>
                </div>

                <div class="contact-form-group">
                    <label for="amount" class="contact-label">Quantidade de pessoas</label>
                    <input type="number" id="amount" class="contact-input" placeholder="Ex: 5" required>
                </div>

                <div class="contact-form-group">
                    <label for="message" class="contact-label">Mensagem</label>
                    <input type="text" id="message" class="contact-input" placeholder="Ex: Amo Barcelona" required>
                </div>

                <button type="submit" class="contact-button">Enviar</button>

            </form>
        </section>

        <a href="../index.html" class="back-button">Voltar</a>

    </main>

    <footer class="site-footer">
        <p class="footer-text">© 2026 TripWay — Todos os direitos reservados</p>
        <p class="footer-text">Contato: contato@tripway.com</p>
    </footer>

</body>
</html>
